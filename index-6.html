<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>ЖАР · KuCoin</title>
<style>
:root{
  --ink:#0B0E14; --panel:#141924; --panel2:#1A2130; --line:#242D3D;
  --text:#E6EAF2; --dim:#7C8798;
  --cold:#3B82C4; --warm:#F2A33C; --hot:#FF5B2E; --blaze:#FFD9C2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 40px}
.num{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 14px 9px}
.brand{display:flex;align-items:baseline;gap:9px}
.brand h1{margin:0;font-size:24px;letter-spacing:.22em;font-weight:800;
  background:linear-gradient(92deg,var(--warm),var(--hot) 60%,var(--blaze));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.08em}
.status{margin-top:6px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.status b{color:var(--text);font-weight:600}
.warm{margin-top:7px;height:3px;background:#1E2534;border-radius:2px;overflow:hidden}
.warm i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--warm),var(--hot));transition:width .5s}

.row{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#12060A}
.chip.alt[aria-pressed="true"]{background:var(--panel2);border-color:var(--warm);color:var(--warm)}
.lbl{padding:12px 14px 2px;font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.ghost{padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

.list{padding:8px 12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;margin-bottom:8px;overflow:hidden;cursor:pointer}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:#2A1810;border-color:var(--hot)}100%{background:var(--panel);border-color:var(--line)}}
.top{display:flex;align-items:center;gap:9px}
.tick{font-size:16px;font-weight:800;letter-spacing:.03em}
.pin{color:var(--warm);font-size:11px}
.price{margin-left:auto;font-size:14px;font-weight:700}
.mid{display:flex;gap:15px;margin-top:9px;align-items:flex-end}
.tf .k{font-size:9px;color:var(--dim);letter-spacing:.1em}
.tf .v{font-size:15px;font-weight:700;line-height:1.2}
.meta{margin-left:auto;text-align:right;font-size:10px;color:var(--dim);line-height:1.5}
.badge{position:absolute;top:0;right:0;padding:3px 9px;font-size:9px;font-weight:800;
  letter-spacing:.12em;background:var(--hot);color:#12060A;border-radius:0 13px 0 10px}
.plan{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;line-height:1.85}
.plan .g{display:flex;justify-content:space-between}
.plan .g span:last-child{font-weight:700}
.hint{font-size:10px;color:var(--dim);margin-top:7px;line-height:1.5}
.empty{padding:46px 24px;text-align:center;color:var(--dim);font-size:13px;line-height:1.8}
.err{margin:12px;padding:12px;border:1px solid #4A2318;background:#1E1210;border-radius:12px;
  font-size:12px;color:#F2A33C;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>ЖАР</h1><span>живая лента KuCoin</span></div>
  <div class="status"><span id="stat">подключаюсь…</span><button class="ghost" id="soundBtn">🔔 вкл</button></div>
  <div class="warm"><i id="warmBar"></i></div>
</header>

<div class="lbl">Сортировка</div>
<div class="row" id="sortRow">
  <button class="chip" data-sort="d5" aria-pressed="true">Δ 5 мин</button>
  <button class="chip" data-sort="d15">Δ 15 мин</button>
  <button class="chip" data-sort="d60">Δ 1 час</button>
  <button class="chip" data-sort="d24">24 часа</button>
  <button class="chip" data-sort="vol">Оборот</button>
</div>

<div class="lbl">Что показывать</div>
<div class="row" id="setRow">
  <button class="chip alt" data-set="meme" aria-pressed="true">Мемкоины</button>
  <button class="chip alt" data-set="mine">Мои 4</button>
  <button class="chip alt" data-set="all">Все пары USDT</button>
</div>

<div class="lbl">Сигнал: рывок за 5 минут</div>
<div class="row" id="trigRow">
  <button class="chip alt" data-trig="1">от 1%</button>
  <button class="chip alt" data-trig="2" aria-pressed="true">от 2%</button>
  <button class="chip alt" data-trig="4">от 4%</button>
  <button class="chip alt" data-trig="99">выключить</button>
</div>

<div id="err"></div>
<div class="list" id="list"><div class="empty">Первые 5 минут собираю базу цен.<br>Рывки начнут появляться, как только накопится история.</div></div>

<script>
const MINE = ['SHIB','PEPE','BONK','FLOKI'];
const MEME = ['DOGE','SHIB','PEPE','BONK','FLOKI','WIF','BOME','MEW','POPCAT','MOG','BRETT','TURBO',
'NEIRO','PNUT','ACT','GOAT','SPX','MEME','LADYS','ELON','BABYDOGE','WEN','MYRO','SLERF','DEGEN','TOSHI',
'HIPPO','MUMU','SUNDOG','DOGS','CAT','MOODENG','CHILLGUY','FARTCOIN','TRUMP','MELANIA','PENGU','AI16Z',
'ZEREBRO','GIGA','BILLY','MICHI','PONKE','ANDY','RETARDIO','SNEK','AIDOGE','KISHU','LEASH','SAMO','TOSHI'];

const KU = 'https://api.kucoin.com/api/v1/market/allTickers';
const CG = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=meme-token&order=volume_desc&per_page=250&page=1';
const KU_CANDLES = s => `https://api.kucoin.com/api/v1/market/candles?type=1day&symbol=${s}`;
const CG_CHART = id => `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=30&interval=daily`;
const POLL = 20000, WINDOW = 70*60*1000;

let state = {sort:'d5', set:'meme', trig:2, sound:true};
let snaps = [], live = new Map(), openCard = null, plans = new Map(), alerted = new Set();
let started = Date.now(), source = null, tick = 0;

const fmtP = p => p >= 1 ? p.toLocaleString('en-US',{maximumFractionDigits:3}) : p.toPrecision(4).replace(/0+$/,'');
const fmtB = n => !n ? '—' : n>=1e9 ? '$'+(n/1e9).toFixed(2)+'B' : n>=1e6 ? '$'+(n/1e6).toFixed(1)+'M' : '$'+Math.round(n/1e3)+'K';
const pct = v => v==null ? '—' : (v>0?'+':'')+v.toFixed(2)+'%';
function heat(v){
  if(v==null) return '#5A6474';
  if(v<=-5) return '#2E6FA8'; if(v<0) return '#4FA3D1';
  if(v<0.5) return '#8C9AAE'; if(v<2) return '#F2A33C';
  if(v<6) return '#FF5B2E'; return '#FFD9C2';
}
function beep(){
  if(!state.sound) return;
  try{
    const c=new (window.AudioContext||window.webkitAudioContext)(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination); o.type='triangle'; o.frequency.value=920;
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.28,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.start(); o.stop(c.currentTime+.55);
  }catch(e){}
}

function delta(sym, mins){
  const cut = Date.now() - mins*60000;
  let old = null;
  for(const s of snaps){ if(s.t <= cut) old = s; else break; }
  if(!old) return null;
  const was = old.p.get(sym), now = live.get(sym)?.price;
  if(!was || !now) return null;
  return (now/was - 1)*100;
}

async function fromKu(){
  const r = await fetch(KU);
  if(!r.ok) throw new Error('KuCoin код '+r.status);
  const j = await r.json();
  return j.data.ticker.filter(t=>t.symbol.endsWith('-USDT') && t.last).map(t=>({
    sym:t.symbol, base:t.symbol.replace('-USDT',''), id:null, price:+t.last,
    d24:(+t.changeRate||0)*100, vol:+t.volValue||0, high:+t.high||0, low:+t.low||0
  }));
}
async function fromCG(){
  const r = await fetch(CG);
  if(!r.ok) throw new Error('CoinGecko код '+r.status);
  const j = await r.json();
  return j.filter(c=>c.current_price).map(c=>({
    sym:c.symbol.toUpperCase()+'-USDT', base:c.symbol.toUpperCase(), id:c.id, price:c.current_price,
    d24:c.price_change_percentage_24h||0, vol:c.total_volume||0, high:c.high_24h||0, low:c.low_24h||0
  }));
}

function fail(html){ document.getElementById('err').innerHTML = '<div class="err">'+html+'</div>'; }

async function poll(){
  if(location.protocol==='content:' || location.protocol==='file:'){
    fail('<b>Страница открыта как файл, а не как сайт.</b><br>'+
         'Адрес начинается на <span class="num">'+location.protocol+'//</span> — браузер запрещает таким страницам ходить в интернет, '+
         'поэтому биржа недоступна.<br><br>Нужен обычный адрес на https. Загрузи файл на GitHub Pages и открой оттуда.');
    return;
  }
  tick++;
  if(source==='gecko' && tick % 3 !== 1) return;   // CoinGecko лимитирует, опрашиваем раз в минуту

  let rows = null, errs = [];
  if(source !== 'gecko'){
    try{ rows = await fromKu(); source='kucoin'; }catch(e){ errs.push('KuCoin: '+e.message); }
  }
  if(!rows){
    try{ rows = await fromCG(); source='gecko'; }catch(e){ errs.push('CoinGecko: '+e.message); }
  }
  if(!rows){
    fail('<b>Оба источника молчат.</b><br>'+errs.join('<br>')+
         '<br><br>Проверь интернет. Если сеть есть — биржа режет запросы из браузера, тогда нужен серверный вариант.');
    return;
  }

  const snap = new Map();
  rows.forEach(c=>{ live.set(c.base, c); snap.set(c.base, c.price); });
  snaps.push({t:Date.now(), p:snap});
  while(snaps.length && snaps[0].t < Date.now()-WINDOW) snaps.shift();

  document.getElementById('err').innerHTML='';
  document.getElementById('stat').innerHTML =
    (source==='kucoin' ? 'KuCoin' : 'CoinGecko (запасной)') +
    ' · пар: <b>'+live.size+'</b> · <b>'+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b>';
  document.getElementById('warmBar').style.width = Math.min(100,(Date.now()-started)/(5*60000)*100)+'%';
  render();
}

function render(){
  let arr = [...live.values()];
  if(state.set==='mine') arr = arr.filter(c=>MINE.includes(c.base));
  else if(state.set==='meme') arr = arr.filter(c=>MEME.includes(c.base));
  else arr = arr.filter(c=>c.vol >= 200000);

  arr.forEach(c=>{ c.d5=delta(c.base,5); c.d15=delta(c.base,15); c.d60=delta(c.base,60); });

  const k = {d5:c=>c.d5??-999, d15:c=>c.d15??-999, d60:c=>c.d60??-999, d24:c=>c.d24, vol:c=>c.vol}[state.sort];
  arr.sort((a,b)=>k(b)-k(a));
  arr = arr.slice(0,50);

  const fresh = [];
  arr.forEach(c=>{
    const hit = c.d5!=null && c.d5>=state.trig && c.vol>=300000;
    c.hot = hit;
    if(hit && !alerted.has(c.base)){ fresh.push(c.base); alerted.add(c.base); }
    if(!hit && c.d5!=null && c.d5 < state.trig*0.5) alerted.delete(c.base);
  });
  if(fresh.length) beep();

  const el = document.getElementById('list');
  if(!arr.length){ el.innerHTML='<div class="empty">Пусто под этот фильтр.</div>'; return; }

  el.innerHTML = arr.map(c=>{
    const plan = openCard===c.base ? (plans.get(c.base) || '<div class="plan">считаю уровни…</div>') : '';
    return `<div class="card ${fresh.includes(c.base)?'flash':''}" data-b="${c.base}">
      ${c.hot?'<div class="badge">РЫВОК</div>':''}
      <div class="top">
        <span class="tick">${c.base}</span>${MINE.includes(c.base)?'<span class="pin">★</span>':''}
        <span class="price num" style="margin-right:${c.hot?'58px':'0'}">$${fmtP(c.price)}</span>
      </div>
      <div class="mid">
        <div class="tf"><div class="k">5 МИН</div><div class="v num" style="color:${heat(c.d5)}">${pct(c.d5)}</div></div>
        <div class="tf"><div class="k">15 МИН</div><div class="v num" style="color:${heat(c.d15)}">${pct(c.d15)}</div></div>
        <div class="tf"><div class="k">24 Ч</div><div class="v num" style="color:${heat(c.d24)}">${pct(c.d24)}</div></div>
        <div class="meta">оборот ${fmtB(c.vol)}<br>сут. макс $${fmtP(c.high)}<br>${c.high?('до макс '+((c.price/c.high-1)*100).toFixed(1)+'%'):''}</div>
      </div>
      ${plan}
    </div>`;
  }).join('');
}

/* тап по карточке → дневной ATR и уровни по схеме TP 4 ATR / SL 1 ATR */
document.getElementById('list').addEventListener('click', async e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const b = card.dataset.b;
  if(openCard===b){ openCard=null; render(); return; }
  openCard=b;
  if(plans.has(b)){ render(); return; }
  render();
  try{
    const c = live.get(b);
    let atr, label;
    if(source==='kucoin'){
      const j = await (await fetch(KU_CANDLES(c.sym))).json();
      const rows = j.data.slice(0,20).reverse().map(x=>({c:+x[2],h:+x[3],l:+x[4]}));
      let trs=[];
      for(let i=1;i<rows.length;i++){
        const p=rows[i-1].c, x=rows[i];
        trs.push(Math.max(x.h-x.l, Math.abs(x.h-p), Math.abs(x.l-p)));
      }
      atr = trs.slice(-14).reduce((a,v)=>a+v,0)/Math.min(14,trs.length);
      label = 'ATR дневной';
    } else {
      const j = await (await fetch(CG_CHART(c.id))).json();
      const px = j.prices.map(p=>p[1]);
      let d=[]; for(let i=1;i<px.length;i++) d.push(Math.abs(px[i]-px[i-1]));
      atr = d.slice(-14).reduce((a,v)=>a+v,0)/Math.min(14,d.length);
      label = 'Волатильность за день';
    }
    const P = c.price;
    plans.set(b, `<div class="plan">
      <div class="g"><span>${label}</span><span class="num">$${fmtP(atr)} · ${(atr/P*100).toFixed(1)}%</span></div>
      <div class="g"><span>Стоп −1 ATR</span><span class="num" style="color:#4FA3D1">$${fmtP(P-atr)}</span></div>
      <div class="g"><span>Цель +4 ATR</span><span class="num" style="color:#FF5B2E">$${fmtP(P+4*atr)}</span></div>
      <div class="g"><span>Держать</span><span>8–16 дней</span></div>
      <div class="hint">Уровни с дневного таймфрейма. Комиссия 0,1% на вход и 0,1% на выход: на дневной цели это шум, на пятиминутном рывке это половина движения.</div>
    </div>`);
  }catch(err){
    plans.set(b, '<div class="plan"><div class="hint">Свечи не пришли, уровни посчитать не смог.</div></div>');
  }
  render();
});

function bind(id,attr,cb){
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true'); cb(b.dataset[attr]);
  });
}
bind('sortRow','sort',v=>{state.sort=v;render()});
bind('setRow','set',v=>{state.set=v;render()});
bind('trigRow','trig',v=>{state.trig=+v;alerted.clear();render()});
document.getElementById('soundBtn').addEventListener('click',e=>{
  state.sound=!state.sound; e.target.textContent = state.sound?'🔔 вкл':'🔕 выкл';
});

poll(); setInterval(poll, POLL);
</script>
</body>
</html>
